<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Groww Clone</title>
  </head>

  <body>
    <!-- Navbar -->
    <div
      style="
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 30px;
        border-radius: 10px;
      "
    >
      <!-- Logo -->
      <img src="./Groww-Logo.webp" alt="Image Not Found" width="150" />

      <!-- Menu -->
      <div
        style="
          display: flex;
          gap: 20px;
          font-size: 18px;
          font-weight: bold;
        "
      >
        <div>Stocks</div>
        <div>F&O</div>
        <div>Mutual Funds</div>
        <div>More</div>
      </div>

      <!-- Search + Button -->
      <div style="display: flex; gap: 10px; align-items: center">
        <input
          type="text"
          placeholder="Search Groww..."
          style="
            padding: 10px;
            width: 220px;
            border-radius: 5px;
            border: 1px solid gray;
          "
        />

        <button
          style="
            padding: 10px 20px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
          "
        >
          Login/Sign up
        </button>
      </div>
    </div>

    <br /><br /><br />

    <!-- Hero Section -->
    <div>
      <center>
        <h1>Grow your wealth</h1>

        <button
          style="
            padding: 10px 20px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
          "
        >
          Get started
        </button>
      </center>
    </div>

    <br /><br />

    <!-- Image -->
    <div>
      <center>
        <img
          src="./Groww-Online-Demat-Trading-and-Direct-Mutual-Fund-Investment-in-India.png"
          alt="Image Not Found"
          width="800"
          height="500"
        />
      </center>
    </div>
  </body>
</html>
